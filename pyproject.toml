[project]
name = "dotfiles-tools"
version = "0.1.0"
description = "Personal dotfiles and small local utilities."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["bin", "scripts", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
